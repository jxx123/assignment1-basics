# Configuration for training a transformer language model

model:
  vocab_size: 10000
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344 # If not specified, will be computed as 8/3 * d_model rounded to nearest 64
  rope_theta: 10000.0
  # vocab_size: 50257
  # context_length: 1024
  # d_model: 1600
  # num_layers: 48
  # num_heads: 25
  # d_ff: 6400 # If not specified, will be computed as 8/3 * d_model rounded to nearest 64
  # rope_theta: 10000.0

optimizer:
  name: "adamw"
  lr: 1.0e-3
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

  # Learning rate schedule
  use_lr_schedule: true
  lr_max: 1.0e-3 # If not specified, uses lr
  lr_min: 1.0e-4
  warmup_steps: 1000
  annealing_steps: 4000

  # Gradient clipping
  gradient_clip_norm: 1.0

data:
  train_data_path: "data/TinyStoriesV2-GPT4-train.bin"
  val_data_path: "data/TinyStoriesV2-GPT4-valid.bin"
  batch_size: 32
  device: "mps" # "cuda" or "cpu", "mps"

training:
  num_steps: 5000
  eval_interval: 500
  save_interval: 1000
  log_interval: 100

  # Checkpointing
  checkpoint_dir: "checkpoints"
  resume_from_checkpoint: null # Path to checkpoint file to resume from
  save_checkpoint: true

  # Random seed
  seed: 42

wandb:
  enabled: true
  project: "cs336-assignment1"
  entity: null # Your wandb username/team (optional)
  name: null # Run name (optional, will be auto-generated if null)
  tags: ["transformer", "language-model", "cs336"] # Tags for the run
  notes: "Training transformer language model for CS336 assignment"
  log_model: false # Set to true to log model checkpoints to wandb
